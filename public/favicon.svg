<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#0e1113"/>
    <!-- ring: big, only its lower half visible below the hand, cropped by the edge -->
    <circle cx="256" cy="300" r="200" fill="none" stroke="#2dd4bf" stroke-width="56"/>
    <g stroke="#0e1113" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <!-- forearm, coming in from the top and bent over the ring at the wrist -->
      <path fill="#d9d0c6" d="M236 -30 L410 -30 L372 110 C 360 140 330 156 300 160 L 170 160 C 196 120 214 60 236 -30 Z"/>
      <!-- back of the hand -->
      <path fill="#e9e3dc" d="M92 196 C 92 150 130 126 180 124 L330 124 C 382 126 420 150 420 196 L420 250 L92 250 Z"/>
      <!-- wrist crease (false grip: wrist rolled over the ring) -->
      <path fill="none" stroke="#b9ada1" stroke-width="7" d="M150 150 C 220 168 300 168 380 146"/>
      <!-- four curled fingers wrapped over the ring -->
      <g fill="#e9e3dc">
        <rect x="88"  y="200" width="88" height="160" rx="42"/>
        <rect x="170" y="204" width="88" height="182" rx="42"/>
        <rect x="252" y="204" width="88" height="176" rx="42"/>
        <rect x="334" y="200" width="88" height="150" rx="42"/>
      </g>
      <!-- thumb lying across index and middle finger -->
      <path fill="#e2dad1" d="M70 196 C 60 236 90 270 140 272 L 236 270 C 262 268 274 246 262 228 C 250 212 230 212 200 214 L 138 214 C 120 212 104 196 104 176 Z"/>
    </g>
    <!-- finger joints -->
    <g stroke="#b9ada1" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M110 318 q22 10 44 0"/>
      <path d="M192 344 q22 10 44 0"/>
      <path d="M274 338 q22 10 44 0"/>
      <path d="M356 310 q22 10 44 0"/>
      <path d="M232 238 q8 10 0 22"/>
    </g>
  </g>
</svg>
